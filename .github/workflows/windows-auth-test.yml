name: Windows authentication test installer

on:
  push:
    branches: [codex/windows-auth-test]

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install source dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled Windows runtime
        run: pnpm runtime:prepare -- --target x86_64-pc-windows-msvc
      - name: Verify Windows source
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm build:web
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build test installer without publishing an update
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-test.conf.json
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one test installer' }
          $hash = Get-FileHash $installer[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer[0].Name)" | Set-Content -Encoding utf8 (Join-Path $installer[0].DirectoryName 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-0.1.14-test.1-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
