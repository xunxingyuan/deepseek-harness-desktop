name: Release desktop installers

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            platform: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            platform: macos-26-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install source dependencies
        run: pnpm install --frozen-lockfile
      - name: Import Apple certificate for embedded runtime signing
        if: ${{ runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Prepare pinned self-contained runtime
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: pnpm runtime:prepare -- --target ${{ matrix.target }}
      - name: Verify bundled runtime authentication and upgrade compatibility
        run: |
          pnpm test:runtime
          pnpm test:runtime --uncompressed
      - name: Build unsigned installers and attach to GitHub Release
        if: ${{ vars.ENABLE_APPLE_SIGNING != 'true' }}
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseBody: |
            更新内容

            - 内置 DeepSeek Harness 0.2.1-rc.2，适配 DeepSeek-V4.1-Flash-1017。
            - 跟进 DeepSeek Search 和 Fetch API，可在网页搜索设置中开启。
            - 适配新版 profile 配置，移除已废弃的 patchReload 字段并保留自定义插件配置。
            - 延续原有工作区、历史会话、凭据和数据目录。
            - 保留 WebView 原生认证流程和 Windows 独立运行时升级保护。
            - 内置 Node.js，无需安装环境或运行命令行。

            What's new

            - Bundles DeepSeek Harness 0.2.1-rc.2 with DeepSeek-V4.1-Flash-1017 support.
            - Adds upstream DeepSeek Search and Fetch API support in Web Search settings.
            - Adapts profile configuration by removing the retired patchReload field while preserving custom plugins.
            - Reuses existing workspaces, session history, credentials, and data directories.
            - Retains native WebView authentication and the dedicated Windows runtime upgrade protection.
            - Includes Node.js; no environment setup or command line is required.

            下载 / Downloads

            - Windows x64：推荐 `.exe`，集中部署可使用 `.msi`。
            - Apple Silicon Mac：下载 `aarch64` `.dmg`。
            - Intel Mac：下载 `x64` `.dmg`。
            - macOS 安装包经过签名、公证及内置 Node.js/V8 启动验证。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build signed installers and attach to GitHub Release
        if: ${{ vars.ENABLE_APPLE_SIGNING == 'true' }}
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseBody: |
            更新内容

            - 内置 DeepSeek Harness 0.2.1-rc.2，适配 DeepSeek-V4.1-Flash-1017。
            - 跟进 DeepSeek Search 和 Fetch API，可在网页搜索设置中开启。
            - 适配新版 profile 配置，移除已废弃的 patchReload 字段并保留自定义插件配置。
            - 延续原有工作区、历史会话、凭据和数据目录。
            - 保留 WebView 原生认证流程和 Windows 独立运行时升级保护。
            - 内置 Node.js，无需安装环境或运行命令行。

            What's new

            - Bundles DeepSeek Harness 0.2.1-rc.2 with DeepSeek-V4.1-Flash-1017 support.
            - Adds upstream DeepSeek Search and Fetch API support in Web Search settings.
            - Adapts profile configuration by removing the retired patchReload field while preserving custom plugins.
            - Reuses existing workspaces, session history, credentials, and data directories.
            - Retains native WebView authentication and the dedicated Windows runtime upgrade protection.
            - Includes Node.js; no environment setup or command line is required.

            下载 / Downloads

            - Windows x64：推荐 `.exe`，集中部署可使用 `.msi`。
            - Apple Silicon Mac：下载 `aarch64` `.dmg`。
            - Intel Mac：下载 `x64` `.dmg`。
            - macOS 安装包经过签名、公证及内置 Node.js/V8 启动验证。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify signed macOS Node runtime in final DMG
        if: ${{ runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING == 'true' }}
        shell: bash
        run: |
          shopt -s nullglob
          DMGS=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#DMGS[@]}" -eq 1
          DMG="${DMGS[0]}"

          MOUNT_POINT="$RUNNER_TEMP/dsh-dmg-${{ matrix.target }}"
          mkdir -p "$MOUNT_POINT"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"

          APP="$MOUNT_POINT/DSH Desktop.app"
          NODE="$APP/Contents/MacOS/dsh-runtime"
          ENTITLEMENTS="$RUNNER_TEMP/dsh-app-entitlements.plist"

          test -x "$NODE"
          codesign --verify --strict --verbose=2 "$NODE"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$ENTITLEMENTS"
          ENTITLEMENT_SUMMARY="$(plutil -p "$ENTITLEMENTS")"

          for key in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-executable-page-protection \
            com.apple.security.cs.disable-library-validation
          do
            printf '%s\n' "$ENTITLEMENT_SUMMARY" | grep -F "\"$key\" => true" >/dev/null
          done

          "$NODE" -e "const v8 = require('node:v8'); console.log(process.version, v8.getHeapStatistics().heap_size_limit)"

  publish-release:
    name: Publish completed release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release after every installer succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          mkdir -p "$RUNNER_TEMP/dsh-update-manifest"
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/dsh-update-manifest"
          jq -e --arg version "$VERSION" '
            .version == $version and
            (.platforms["windows-x86_64"].url | type == "string") and
            (.platforms["windows-x86_64"].signature | type == "string") and
            (.platforms["darwin-aarch64"].url | type == "string") and
            (.platforms["darwin-aarch64"].signature | type == "string") and
            (.platforms["darwin-x86_64"].url | type == "string") and
            (.platforms["darwin-x86_64"].signature | type == "string")
          ' "$RUNNER_TEMP/dsh-update-manifest/latest.json"
          gh release edit "v${VERSION}" --draft=false --repo "${GITHUB_REPOSITORY}"
