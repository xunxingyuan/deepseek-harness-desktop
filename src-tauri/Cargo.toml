[package]
name = "deepseek-harness-desktop"
version = "0.1.7"
description = "A self-contained Tauri desktop distribution of DeepSeek Harness"
authors = ["DSH Desktop contributors"]
license = "MIT"
repository = "https://github.com/xunxingyuan/deepseek-harness-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
